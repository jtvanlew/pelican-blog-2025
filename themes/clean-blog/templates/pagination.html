{% if DEFAULT_PAGINATION and articles_paginator and articles_paginator.num_pages > 1 %}
    <!-- Pager: newer on the left, page count in the middle, older on the right -->
    <nav class="site-pager" aria-label="Post pages">
        <div class="site-pager-prev">
            {% if articles_page.has_previous() %}
            <a class="btn btn-primary" href="{{ SITEURL }}/{{ articles_previous_page.url }}" rel="prev">&larr; Newer</a>
            {% endif %}
        </div>
        <div class="site-pager-count">Page {{ articles_page.number }} of {{ articles_paginator.num_pages }}</div>
        <div class="site-pager-next">
            {% if articles_page.has_next() %}
            <a class="btn btn-primary" href="{{ SITEURL }}/{{ articles_next_page.url }}" rel="next">Older &rarr;</a>
            {% endif %}
        </div>
    </nav>
{% endif %}
