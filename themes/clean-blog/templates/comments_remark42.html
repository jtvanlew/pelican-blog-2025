{# Remark42 comments (self-hosted, no ads or tracking).
   Shown only when REMARK42_URL is set (publishconf.py), so local builds skip it.
   `item` is the article or page being rendered. #}
{% if REMARK42_URL and item and item.status != "draft" %}
<section class="comments" aria-label="Comments">
    <h2 class="comments-title">Comments</h2>
    <div id="remark42"></div>
</section>
<script>
    var remark_config = {
        host: '{{ REMARK42_URL }}',
        site_id: '{{ REMARK42_SITE_ID }}',
        {% if SITEURL %}url: '{{ SITEURL }}/{{ item.url }}',{% endif %}
        components: ['embed'],
        theme: 'dark',
        show_email_subscription: false,
        no_footer: true
    };
    !function (e, n) {
        for (var o = 0; o < e.length; o++) {
            var r = n.createElement('script'), c = '.js', d = n.head || n.body;
            'noModule' in r ? (r.type = 'module', c = '.mjs') : r.async = !0;
            r.defer = !0; r.src = remark_config.host + '/web/' + e[o] + c; d.appendChild(r);
        }
    }(remark_config.components || ['embed'], document);
</script>
{% endif %}
