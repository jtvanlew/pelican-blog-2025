[project]
name = "pelican-blog-2025"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pelican>=4.11.0",
    "pelican-image-process>=3.0.4",
    "pelican-photos>=1.6.2",
    "livereload>=2.7.1",
    "markdown>=3.7",
    "typogrify>=2.1.0",
    "invoke>=2.2.0",
    "pillow>=11.1.0",
    "lxml>=5.3.1",
    "rich>=13.9.4",
    "beautifulsoup4>=4.13.3",
    "unidecode>=1.3.8",
]

[tool.uv]
# Use `uv sync` to create/update the virtual environment (.venv)
# Use `uv run pelican content` to run commands in the venv
